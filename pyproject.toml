[project]
name = "rsi-bench"
version = "1.0.0"
description = "RSI Control Arena: can an AI R&D agent covertly sabotage the successor model it trains?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Probe-set and task-environment builders (scripts/build/, scripts/fetch_data.sh).
data = [
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
]
# GPU-backed ModelEvals (adapted from PostTrainBench evaluate.py). Heavy — install only
# where real post-training / eval runs happen.
gpu = [
    "vllm>=0.11.0",
    "transformers>=4.57",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Remote (Modal) run target — see docs/REPRODUCING.md. Client-side only: it launches and collects
# sandboxes, so it belongs in the light .venv, not in the heavy train/serve venvs.
modal = [
    "modal>=1.5",
    "requests>=2.31",
]
# Paper tables and figures (analysis/scripts).
analysis = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsi_bench"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
